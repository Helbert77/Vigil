<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Recovery Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Recovery Flow</h1>
    
    <div class="section">
        <h2>URL Analysis</h2>
        <div id="url-analysis"></div>
    </div>
    
    <div class="section">
        <h2>Hash Parameters</h2>
        <div id="hash-params"></div>
    </div>
    
    <div class="section">
        <h2>Query Parameters</h2>
        <div id="query-params"></div>
    </div>
    
    <div class="section">
        <h2>Session State</h2>
        <div id="session-state"></div>
    </div>
    
    <div class="section">
        <h2>Test Recovery Link</h2>
        <input type="email" id="test-email" placeholder="Digite seu email" style="width: 300px; padding: 8px;">
        <button onclick="testRecoveryFlow()" style="padding: 8px 16px; margin-left: 10px;">Enviar Link de Teste</button>
        <div id="test-result" style="margin-top: 10px;"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@2';
        
        const SUPABASE_URL = "https://oprqgllsqtfdyjgvgovo.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcnFnbGxzcXRmZHlqZ3Znb3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkyNjIzMDQsImV4cCI6MjA3NDgzODMwNH0.MilSiXXMS3Ko_NNnfasCqFyURuD5zpZNCdbVE324_Jw";
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        function analyzeURL() {
            const urlAnalysis = document.getElementById('url-analysis');
            const hashParams = document.getElementById('hash-params');
            const queryParams = document.getElementById('query-params');
            
            // Análise da URL atual
            const currentURL = window.location.href;
            const hash = window.location.hash;
            const search = window.location.search;
            
            urlAnalysis.innerHTML = `
                <p><strong>URL Completa:</strong> ${currentURL}</p>
                <p><strong>Hash:</strong> ${hash || 'Nenhum'}</p>
                <p><strong>Query String:</strong> ${search || 'Nenhuma'}</p>
            `;
            
            // Análise dos parâmetros do hash
            if (hash) {
                const hashWithoutSymbol = hash.substring(1);
                const hashParamsObj = new URLSearchParams(hashWithoutSymbol);
                let hashParamsHTML = '<h3>Parâmetros do Hash:</h3>';
                
                for (const [key, value] of hashParamsObj.entries()) {
                    hashParamsHTML += `<p><strong>${key}:</strong> ${value}</p>`;
                }
                
                // Verificações específicas para recovery
                const type = hashParamsObj.get('type');
                const accessToken = hashParamsObj.get('access_token');
                const refreshToken = hashParamsObj.get('refresh_token');
                
                if (type === 'recovery') {
                    hashParamsHTML += '<p class="success">✓ Tipo de recovery detectado</p>';
                } else {
                    hashParamsHTML += '<p class="error">✗ Tipo de recovery NÃO detectado</p>';
                }
                
                if (accessToken) {
                    hashParamsHTML += '<p class="success">✓ Access token presente</p>';
                } else {
                    hashParamsHTML += '<p class="error">✗ Access token ausente</p>';
                }
                
                if (refreshToken) {
                    hashParamsHTML += '<p class="success">✓ Refresh token presente</p>';
                } else {
                    hashParamsHTML += '<p class="error">✗ Refresh token ausente</p>';
                }
                
                hashParams.innerHTML = hashParamsHTML;
            } else {
                hashParams.innerHTML = '<p>Nenhum parâmetro de hash encontrado</p>';
            }
            
            // Análise dos parâmetros de query
            if (search) {
                const queryParamsObj = new URLSearchParams(search);
                let queryParamsHTML = '<h3>Parâmetros de Query:</h3>';
                
                for (const [key, value] of queryParamsObj.entries()) {
                    queryParamsHTML += `<p><strong>${key}:</strong> ${value}</p>`;
                }
                
                queryParams.innerHTML = queryParamsHTML;
            } else {
                queryParams.innerHTML = '<p>Nenhum parâmetro de query encontrado</p>';
            }
        }
        
        async function checkSessionState() {
            const sessionState = document.getElementById('session-state');
            
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    sessionState.innerHTML = `<p class="error">Erro ao obter sessão: ${error.message}</p>`;
                    return;
                }
                
                if (session) {
                    sessionState.innerHTML = `
                        <p class="success">✓ Sessão ativa encontrada</p>
                        <p><strong>User ID:</strong> ${session.user.id}</p>
                        <p><strong>Email:</strong> ${session.user.email}</p>
                        <p><strong>Criado em:</strong> ${new Date(session.user.created_at).toLocaleString()}</p>
                        <p><strong>Última atualização:</strong> ${new Date(session.user.updated_at).toLocaleString()}</p>
                        <p><strong>Token expira em:</strong> ${new Date(session.expires_at * 1000).toLocaleString()}</p>
                    `;
                } else {
                    sessionState.innerHTML = '<p class="info">Nenhuma sessão ativa</p>';
                }
            } catch (err) {
                sessionState.innerHTML = `<p class="error">Erro: ${err.message}</p>`;
            }
        }
        
        window.testRecoveryFlow = async function() {
            const email = document.getElementById('test-email').value;
            const testResult = document.getElementById('test-result');
            
            if (!email) {
                testResult.innerHTML = '<p class="error">Por favor, digite um email</p>';
                return;
            }
            
            try {
                testResult.innerHTML = '<p class="info">Enviando link de recovery...</p>';
                
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/update-password`,
                });
                
                if (error) {
                    testResult.innerHTML = `<p class="error">Erro: ${error.message}</p>`;
                } else {
                    testResult.innerHTML = `
                        <p class="success">✓ Link de recovery enviado para ${email}</p>
                        <p><strong>Redirect URL configurada:</strong> ${window.location.origin}/update-password</p>
                        <p class="info">Verifique seu email e clique no link para testar o fluxo</p>
                    `;
                }
            } catch (err) {
                testResult.innerHTML = `<p class="error">Erro: ${err.message}</p>`;
            }
        };
        
        // Monitorar mudanças de autenticação
        supabase.auth.onAuthStateChange((event, session) => {
            console.log('Auth state change:', event, session);
            
            if (event === 'PASSWORD_RECOVERY') {
                console.log('PASSWORD_RECOVERY event detected');
            }
            
            if (event === 'SIGNED_IN' && session) {
                console.log('User signed in during recovery flow');
            }
            
            checkSessionState();
        });
        
        // Executar análises iniciais
        analyzeURL();
        checkSessionState();
        
        // Atualizar a cada 5 segundos
        setInterval(() => {
            analyzeURL();
            checkSessionState();
        }, 5000);
    </script>
</body>
</html>
